spring.application.name=restaurant-pos

# Server Port (Dynamic for deployment: Heroku, AWS, Docker, Render, etc.)
server.port=${PORT:8080}

# Database Configuration (MSSQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=restaurant_pos;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sasa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA MSSQL Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:TableflowRestaurantPosEnterpriseSecretKey2026JwtSecuritySigningKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Comma-separated origins, or * for all)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ==============================================================================
# SWIGGY & ZOMATO AGGREGATOR INTEGRATION CONFIGURATION
# Sirf yahan apni live credentials / API Keys change karein jab live account mile!
# ==============================================================================

# Mode: SIMULATION (Safe offline dev/testing) ya LIVE (Real Swiggy/Zomato servers)
aggregator.mode=${AGGREGATOR_MODE:SIMULATION}
aggregator.auto-accept=${AGGREGATOR_AUTO_ACCEPT:false}
aggregator.default-prep-time=${AGGREGATOR_DEFAULT_PREP_TIME:15}

# --- ZOMATO PARTNER API CREDENTIALS ---
aggregator.zomato-base-url=${ZOMATO_BASE_URL:https://api.zomato.com/v1}
aggregator.zomato-api-key=${ZOMATO_API_KEY:YOUR_ZOMATO_API_KEY_HERE}
aggregator.zomato-secret=${ZOMATO_SECRET:YOUR_ZOMATO_SECRET_KEY_HERE}
aggregator.zomato-store-id=${ZOMATO_STORE_ID:YOUR_ZOMATO_STORE_ID_HERE}

# --- SWIGGY PARTNER API CREDENTIALS ---
aggregator.swiggy-base-url=${SWIGGY_BASE_URL:https://partner-api.swiggy.com/v1}
aggregator.swiggy-api-key=${SWIGGY_API_KEY:YOUR_SWIGGY_API_KEY_HERE}
aggregator.swiggy-secret=${SWIGGY_SECRET:YOUR_SWIGGY_SECRET_KEY_HERE}
aggregator.swiggy-restaurant-id=${SWIGGY_RESTAURANT_ID:YOUR_SWIGGY_RESTAURANT_ID_HERE}

