spring.application.name=restaurant-pos

# Server Port (Dynamic for deployment: Heroku, AWS, Docker, Render, etc.)
server.port=${PORT:8080}

# Database Configuration (MSSQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=restaurant_pos;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sasa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA MSSQL Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:TableflowRestaurantPosEnterpriseSecretKey2026JwtSecuritySigningKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (Comma-separated origins, or * for all)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
